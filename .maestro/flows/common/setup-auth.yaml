appId: ${APP_ID}
tags:
  - util
---
# Reusable Authentication Setup Flow
#
# This flow handles Clerk authentication using test credentials.
# Use this as a runFlow step in other test flows to ensure user is authenticated.
#
# Clerk Test Credentials (Development Mode):
# - Email: Any email with +clerk_test suffix (e.g., test+clerk_test@example.com)
# - Phone: +1 (XXX) 555-0100 to +1 (XXX) 555-0199
# - Verification Code: Always 424242

- launchApp

# Check if already signed in by looking for user menu
- runFlow:
    when:
      visible: "User Menu"
    commands:
      - stopApp

# Not signed in, proceed with sign-up flow
- tapOn: "Get started"

# Fill sign-up form
- tapOn: "Email"
- inputText: "test+clerk_test@example.com"

- tapOn: "Password"
- inputText: "TestPassword123!"

- tapOn: "Create account"

# Wait for verification screen
- assertVisible: "Verification code"

# Enter verification code (always 424242 for test emails)
- tapOn: "Verification code"
- inputText: "424242"

- tapOn: "Verify"

# Wait for successful authentication (should see Active tab)
- assertVisible: "Active"
