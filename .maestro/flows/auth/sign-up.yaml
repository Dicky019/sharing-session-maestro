appId: ${APP_ID}
tags:
  - smokeTest
  - auth
---
# Test: Sign Up with New Account
#
# Purpose: Verify complete user registration flow with email verification
#
# Prerequisites:
# - App is installed on device/simulator
# - Using Clerk test email format for automatic verification
#
# Test Steps:
# 1. Load test credentials from JavaScript helper
# 2. Launch app
# 3. Navigate to sign-up screen
# 4. Fill in first name from credentials
# 5. Fill in last name from credentials
# 6. Fill in username from credentials and copy for later verification
# 7. Fill in email from credentials (Clerk test format)
# 8. Fill in password from credentials
# 9. Submit registration form
# 10. Enter verification code from credentials (424242 for test emails)
# 11. Complete sign-up process
# 12. Verify user is logged in and redirected to home
#
# Expected Result:
# - Account is created successfully
# - Email verification completes with test code
# - User is signed in automatically
# - User menu shows with correct username
#
# Test Data:
# - All credentials loaded from credentials.js
# - Email: test+clerk_test@example.com (Clerk test format)
# - Verification Code: 424242 (Clerk test code)

# Load test sign-up
- runScript: js/sign-up.js

- launchApp

# Sign out first if already logged in
- runFlow:
    when:
      visible:
        id: "user-menu-.*"
    file: ../common/popover-sign-out.yaml

# Navigate to sign-up screen
- tapOn: "Sign up"

# Fill in first name (from JavaScript credentials)
- tapOn:
    id: "first-name"
- inputText: ${output.TEST_FIRST_NAME}

# Fill in last name (from JavaScript credentials)
- tapOn:
    id: "last-name"
- inputText: ${output.TEST_LAST_NAME}

# Fill in username and copy it for later assertion (from JavaScript credentials)
- tapOn:
    id: "username"
- inputText: ${output.TEST_USERNAME}
- copyTextFrom:
    id: "username"

# Fill in email (from JavaScript credentials - using Clerk test format)
- tapOn: "m@example.com"
- inputText: ${output.TEST_EMAIL}

# Fill in password and proceed to verification (from JavaScript credentials)
- tapOn: "next"
- inputText: ${output.TEST_PASSWORD}

# Submit form to trigger email verification
- tapOn: "send"

# Enter verification code (from JavaScript credentials - 424242 is the test code for Clerk)
- tapOn:
    id: "code"
- inputText: ${output.VERIFICATION_CODE}

# Submit verification code
- tapOn:
    id: "verify-email-submit"

# Verify successful sign-up - user menu should be visible with username
- assertVisible:
    id: ${"user-menu-" + maestro.copiedText}
