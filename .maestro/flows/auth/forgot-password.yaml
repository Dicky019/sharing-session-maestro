appId: ${APP_ID}
tags:
  - smokeTest
  - auth
---
# Test: Sign In with Existing Account
#
# Purpose: Verify user can successfully sign in with valid credentials
#
# Prerequisites:
# - User account must exist (created via sign-up flow or using test credentials)
# - App is installed on device/simulator
#
# Test Steps:
# 1. Load test credentials from JavaScript helper
# 2. Launch app
# 3. Sign out if already logged in
# 4. Verify sign-in screen is displayed
# 5. Fill in email address from credentials
# 6. Fill in password from credentials
# 7. Submit sign-in form
# 8. Verify successful authentication and navigation to home screen
#
# Expected Result:
# - User is signed in successfully
# - App navigates to home/tabs screen
# - User menu is visible in header
#
# Test Data:
# - Email: Loaded from credentials.js (test+clerk_test@example.com)
# - Password: Loaded from credentials.js (TestPassword123!)

# Load test credentials
- runScript: js/forgot-password.js

- launchApp

# Sign out first if already logged in
- runFlow:
    when:
      visible:
        id: "user-menu-.*"
    file: ../common/popover-sign-out.yaml

# Verify we're on sign-in screen
- assertVisible: "SignIn to .*"
- assertVisible: "Welcome back! Please sign in to continue"

- tapOn: "Forgot your password?"

# Fill in email address (from JavaScript credentials)
- tapOn: "m@example.com"
- inputText: ${output.TEST_EMAIL}

# Fill in password (from JavaScript credentials)
- tapOn:
    id: "forgot-password-submit"

- tapOn:
    id: "reset-password-new"
- inputText: ${output.TEST_NEW_PASSWORD}

- tapOn:
    id: "reset-password-code"
- inputText: ${output.VERIFICATION_CODE}

- tapOn:
    id: "reset-password-submit"

# Verify successful forgot-password (user menu should be visible)
- runFlow: ../common/verify-success-auth.yaml
