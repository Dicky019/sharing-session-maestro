appId: ${APP_ID}
tags:
  - smokeTest
  - todos
---
# Test: Create Todo with All Required Fields
#
# Purpose: Verify complete todo creation flow with all mandatory fields
#
# Prerequisites:
# - User must be authenticated
# - App is on Active todos tab
#
# Test Steps:
# 1. Authenticate user if not already signed in
# 2. Navigate to Active tab
# 3. Open create todo form
# 4. Fill in title (required, max 100 chars)
# 5. Fill in description (required, max 500 chars)
# 6. Select icon from picker (ShoppingCart)
# 7. Set due date/time (tomorrow at specific time)
# 8. Submit form
# 9. Verify success message
# 10. Verify todo appears in Active tab with correct data
#
# Expected Result:
# - Todo is created successfully in Convex database
# - Success toast message is displayed
# - Todo appears in Active tab list
# - Todo shows correct title, description, icon, and status
#
# Test Data:
# - Title: "Buy groceries"
# - Description: "Get milk, eggs, bread, and vegetables for the week"
# - Icon: ShoppingCart
# - Due Date: Tomorrow (calculated via JavaScript helper)
# - Status: Active (default for new todos)

# Sign in if not already authenticated
- runFlow:
    when:
      visible: "SignIn to .*"
    file: ../auth/sign-in.yaml

# Ensure we're on Active tab
- tapOn:
    id: "acti"

# Open create todo form (via FAB or header button)
- tapOn: "Create new todo"

# Fill in title (required field)
- tapOn:
    id: "todo-title-input"
- inputText: "Buy groceries"

# Fill in description (required field)
- tapOn:
    id: "todo-description-input"
- inputText: "Get milk, eggs, bread, and vegetables for the week"

# Hide keyboard to access icon picker
- hideKeyboard

# Scroll to reveal icon picker (may be below fold)
- scroll

# Select icon from picker (ShoppingCart)
- tapOn: "ShoppingCart"

# Calculate tomorrow's date and target time using JavaScript helper
- runScript: calculate-datetime.js

- runFlow:
    when:
      true: ${maestro.platform == 'android'}
    file: date-picker/android-date-picker.yaml

- runFlow:
    when:
      true: ${maestro.platform == 'ios'}
    file: date-picker/ios-date-picker.yaml

# Submit the form
- tapOn:
    id: "create-todo-submit"

# Verify success message or navigation back to list
- assertVisible: "Todo created successfully"
- tapOn: "OK"

# Verify todo appears in list with correct title
- assertVisible: "Buy groceries"

# Verify todo shows correct description
- assertVisible: "Get milk, eggs, bread, and vegetables for the week"

# Verify it shows the shopping cart icon (testID format)
- assertVisible:
    id: "todo-icon-ShoppingCart"

# Verify status badge shows Active (default for new todos)
- assertVisible:
    id: "active"
